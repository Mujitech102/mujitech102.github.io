
<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>404 – Seite nicht gefunden | Mujitech</title>

  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/png" href="/logo.webp">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      padding: 20px 7%;
      border-bottom: 1px solid #eee;
    }

    header img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 20px;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 650px;
    }

    .error {
      margin-bottom: 25px;
      font-size: clamp(100px, 18vw, 180px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -10px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -1px;
    }

    p {
      margin: 0 auto 35px;
      max-width: 520px;
      color: #666;
      font-size: 16px;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      display: inline-block;
      padding: 15px 24px;
      border: 1px solid #111;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.2s;
    }

    .button:hover {
      background: #333;
      transform: translateY(-2px);
    }

    .button.secondary {
      background: #fff;
      color: #111;
    }

    .button.secondary:hover {
      background: #f5f5f5;
    }

    footer {
      padding: 25px 15px;
      border-top: 1px solid #eee;
      color: #777;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      header {
        padding: 15px 5%;
      }

      .error {
        letter-spacing: -5px;
      }

      .buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="/" aria-label="Mujitech Startseite">
      <img src="/logo.webp" alt="Mujitech Logo">
    </a>
  </header>

  <main>
    <div class="content">

      <div class="error">404</div>

      <h1>Diese Seite wurde nicht gefunden.</h1>

      <p>
        Der gesuchte Link ist möglicherweise veraltet
        oder die Seite wurde verschoben.
        Entdecke unsere aktuellen Dienstleistungen
        oder kontaktiere uns direkt.
      </p>

      <div class="buttons">

        <a href="/" class="button">
          Zur Startseite
        </a>

        <a href="/reparaturen.html" class="button secondary">
          Reparaturen
        </a>

        <a href="/kontakt.html" class="button secondary">
          Kontakt
        </a>

      </div>

    </div>
  </main>

  <footer>
    © Mujitech · Reparatur, Technik & IT · St. Gallen
  </footer>

</body>
</html>


<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Seite nicht gefunden | Mujitech</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 7%;
      border-bottom: 1px solid #eee;
    }

    header img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 65px 20px;
    }

    .content {
      max-width: 650px;
    }

    .error {
      font-size: clamp(100px, 18vw, 180px);
      font-weight: 900;
      letter-spacing: -12px;
      line-height: 1;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -1.5px;
      margin: 0 0 20px;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-block;
      padding: 15px 24px;
      border: 1px solid #111;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.2s;
    }

    .button:hover {
      background: #333;
      transform: translateY(-2px);
    }

    .button.secondary {
      background: #fff;
      color: #111;
    }

    .button.secondary:hover {
      background: #f5f5f5;
    }

    footer {
      padding: 25px;
      border-top: 1px solid #eee;
      text-align: center;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <a href="/" aria-label="Mujitech Startseite">
      <img src="/logo.png" alt="Mujitech Logo">
    </a>
  </header>

  <main>
    <div class="content">
      <div class="error">404</div>

      <h1>Diese Seite wurde nicht gefunden.</h1>

      <p>
        Der gesuchte Link ist möglicherweise veraltet
        oder die Seite wurde verschoben.
        Entdecke unsere aktuellen Dienstleistungen
        oder kontaktiere uns direkt.
      </p>

      <div class="buttons">
        <a href="/" class="button">
          Zur Startseite
        </a>

        <a href="/reparaturen.html" class="button secondary">
          Reparaturen
        </a>

        <a href="/kontakt.html" class="button secondary">
          Kontakt
        </a>
      </div>
    </div>
  </main>

  <footer>
    © Mujitech · Reparatur, Technik & IT · St. Gallen
  </footer>

</body>
</html>
